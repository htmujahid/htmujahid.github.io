<body>
<main class="page projects-page">
  <header class="site-header"><a class="wordmark" href="./" aria-label="Talha Mujahid home">tm<span>.</span></a><nav class="site-nav" aria-label="Main navigation"><a href="./">Home</a><a href="projects.html" aria-current="page">Work</a><a href="mailto:htmujahid@gmail.com">Get in touch ↗</a></nav></header>
  <section class="projects-intro"><p class="eyebrow">The project archive</p><h1>Things I’ve built<span>.</span></h1><p>Experiments, open-source tools, and ideas brought to life.</p></section>
  <div class="filters" id="filters"><label for="q">All projects <span id="count" aria-live="polite"></span></label><input id="q" type="search" placeholder="Search projects…" autocomplete="off"></div>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty">No projects match your search.</p>

  <footer class="site-footer"><a href="./">← Back to home</a><span>Talha Mujahid / Software Engineer</span></footer>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace(".0","")+"k":String(n);
let P=[],loaded=false;
const thumb=p=>`<img src="thumbs/${p.thumb}.png" width="1280" height="800" alt="${esc(p.name)} illustration" loading="lazy">`;
function render(){
  const q=$("#q").value.toLowerCase();
  const l=P.filter(p=>(p.name+(p.desc||"")+(p.lang||"")).toLowerCase().includes(q));
  $("#count").textContent=loaded?`(${l.length})`:"";
  $("#empty").style.display=loaded&&!l.length?"block":"none";
  $("#list").innerHTML=l.map(p=>`<li class="item">
    <a class="thumb" href="${p.site||`https://github.com/${p.repo}`}" target="_blank" rel="noopener" tabindex="-1">${thumb(p)}</a>
    <div>
      <div class="row1"><a class="name" href="https://github.com/${p.repo}" target="_blank" rel="noopener">${esc(p.name)}</a>${p.stars?`<span class="stars">&#9733; ${fmt(p.stars)}</span>`:""}</div>
      ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}
      <div class="meta">${p.lang?`<span>${esc(p.lang)}</span>`:""}${p.note?`<span>${esc(p.note)}</span>`:""}${p.site?`<a href="${p.site}" target="_blank" rel="noopener">live &rarr;</a>`:""}<a href="https://github.com/${p.repo}" target="_blank" rel="noopener">source &rarr;</a></div>
    </div></li>`).join("");
}
// projects.live.json is generated at deploy time (scripts/build-projects.mjs) with fresh GitHub
// data; projects.json is the plain list it is built from, used if the live file is missing.
async function load(){
  for(const f of ["projects.live.json","projects.json"]){
    try{const r=await fetch(f);if(r.ok){P=(await r.json()).map(p=>({...p,name:p.note?p.repo:p.repo.split("/").pop()}));break}}catch(e){}
  }
  loaded=true;render();
}
$("#q").oninput=render;
load();
</script>
</body>
</html>
